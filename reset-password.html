<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Owner Password — Patch Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#E63946;--gold:#D4AF37;--bg:#0b0b0b;--card:#151515;--line:#2a2a2a;--text:#f5f5f5;--muted:#aaa}
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1a1a1a,#080808 60%);font-family:Outfit,Arial,sans-serif;color:var(--text);padding:24px}
.card{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.logo{width:70px;height:70px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 18px;border:2px solid #333;background:#222}
h1{font-family:"Space Grotesk",sans-serif;text-align:center;font-size:1.55rem;margin:0 0 8px}p{color:var(--muted);text-align:center;line-height:1.5}.msg{margin:18px 0;padding:12px 14px;border-radius:10px;background:#111;border:1px solid var(--line);font-size:.9rem;display:none}.msg.show{display:block}.msg.error{border-color:#5d1f25;color:#ffb3b8}.msg.ok{border-color:#285c3d;color:#b9ffd0}.group{margin:16px 0}.group label{display:block;font-size:.8rem;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.group input{width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--line);background:#0e0e0e;color:var(--text);outline:none}.group input:focus{border-color:var(--red)}button,a.btn{display:block;width:100%;padding:12px 14px;border:0;border-radius:9px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{margin-top:10px;background:#222;color:#fff;border:1px solid #333}.hidden{display:none!important}.small{font-size:.78rem;color:var(--muted);text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="logo.png" alt="Patch Archive">
  <h1>Reset Owner Password</h1>
  <p>Set a new password for the Patch Archive owner account.</p>
  <div id="message" class="msg"></div>
  <form id="reset-form" class="hidden">
    <div class="group"><label>New Password</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" required></div>
    <div class="group"><label>Confirm Password</label><input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required></div>
    <button id="reset-btn" class="primary" type="submit">Set New Password</button>
  </form>
  <a class="btn secondary" href="https://patcharchive.vercel.app/">Back to Patch Archive</a>
  <div class="small">This page is only for password recovery.</div>
</div>
<script>
const SUPABASE_URL='https://efjgiiiavspvymwxutjj.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_qmit_A7cfBeXCpueM09hcQ_k2IINZ9d';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const msg=document.getElementById('message'); const form=document.getElementById('reset-form'); const btn=document.getElementById('reset-btn');
function show(text,type=''){msg.textContent=text;msg.className='msg show '+type;}
async function boot(){
  try {
    const {data:{session}}=await sb.auth.getSession();
    if(session){ form.classList.remove('hidden'); show('Recovery link accepted. Enter your new password.','ok'); return; }
    // PASSWORD_RECOVERY will be delivered asynchronously when the URL is processed.
    show('Checking your recovery link…');
    const timer=setTimeout(async()=>{
      const {data:{session:session2}}=await sb.auth.getSession();
      if(session2){form.classList.remove('hidden');show('Recovery link accepted. Enter your new password.','ok');}
      else show('This password-reset link is invalid or expired. Please request a new reset email from the Patch Archive owner login.','error');
    },1200);
    sb.auth.onAuthStateChange((event,session3)=>{
      if(event==='PASSWORD_RECOVERY' && session3){clearTimeout(timer);form.classList.remove('hidden');show('Recovery link accepted. Enter your new password.','ok');}
    });
  } catch(err){ show('Could not initialize password recovery: '+(err?.message||err),'error'); }
}
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const p=document.getElementById('new-password').value; const c=document.getElementById('confirm-password').value;
 if(p.length<8)return show('Password must be at least 8 characters.','error');
 if(p!==c)return show('Passwords do not match.','error');
 btn.disabled=true; btn.textContent='Updating…';
 try{ const {error}=await sb.auth.updateUser({password:p}); if(error)throw error; show('Password updated successfully. You can now return to Patch Archive and sign in with your new password.','ok'); form.classList.add('hidden'); setTimeout(()=>location.href='https://patcharchive.vercel.app/',1600); }
 catch(err){ show('Could not update password: '+(err?.message||err),'error'); btn.disabled=false; btn.textContent='Set New Password'; }
});
boot();
</script>
</body>
</html>
